<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document Verification Portal</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

<h1>Document Verification Portal</h1>

</form>

<div id="result"></div>

</div>

<script src="script.js"></script>

</body>
